<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basic Harness</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside>
    <div class="brand">Basic Harness</div>
    <button id="new-chat">+ New chat</button>
    <nav id="chats" aria-label="Chats"></nav>
    <label class="appearance">Appearance
      <select id="theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
    <div class="account">
      <p id="account-status">Not connected</p>
      <button id="login">Continue with ChatGPT</button>
      <button id="logout" hidden>Sign out</button>
      <a href="https://chatgpt.com/#settings/Usage" target="_blank" rel="noopener noreferrer">Manage usage ↗</a>
    </div>
  </aside>
  <main>
    <header>
      <label>Model <select id="model" disabled><option value="">Sign in to load models</option></select></label>
      <input id="model-id" placeholder="Model ID, e.g. gpt-6-sol" aria-label="Model ID" maxlength="128" hidden>
      <label>Effort <select id="effort" disabled><option value="default">Default</option></select></label>
      <button id="speed" type="button" aria-pressed="false" title="Request faster processing without changing reasoning effort. Uses more of your plan allowance; availability and speed depend on the model." disabled>⚡ Fast</button>
    </header>
    <p id="error" role="alert" hidden></p>
    <section id="messages" aria-label="Conversation" aria-live="polite"></section>
    <form id="composer">
      <textarea id="prompt" rows="3" maxlength="32000" placeholder="Message…" aria-label="Message"></textarea>
      <div class="effort-send">
        <div id="send-efforts" role="menu" aria-label="Send with effort" hidden></div>
        <button id="send-effort" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="send-efforts" title="Hold, drag to an effort above, and release to send" disabled>Effort ↑</button>
      </div>
      <button id="send" type="submit" disabled>Send</button>
    </form>
    <details id="context">
      <summary><span id="context-label">Context: limit unavailable</span></summary>
      <progress id="context-meter" max="100" aria-label="Last reply tokens as a percentage of the catalog context window" hidden></progress>
      <p id="context-breakdown"></p>
      <p id="context-note"></p>
    </details>
    <p class="hint">Enter to send · Shift + Enter for a new line</p>
  </main>
</body>
</html>
